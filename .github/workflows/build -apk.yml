name: Build LLE64 APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android NDK
        shell: pwsh
        run: |
          $sdkManager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
            $sdkManager = "$env:ANDROID_HOME\tools\bin\sdkmanager.bat"
          }
          echo y | & $sdkManager "platforms;android-35" "build-tools;35.0.1" "ndk;27.2.12479018"
      - name: Build ARM64 APK
        working-directory: ./LLEUnified
        shell: pwsh
        run: |
          .\build-arm64.ps1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LLE64-LiveWallpaper
          path: LLEUnified/build/arm64-v8a/*.apk
          
